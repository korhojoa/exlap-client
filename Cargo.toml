[package]
name = "exlap-hook"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The shared ExLAP protocol core. This hook drives its `Machine` over the
# Android Auto vendor channel. The same `Machine` also runs over a TCP socket.
# The protocol logic is fixed once, for both transports.
exlap = "0.1"
# CSPRNG via WASI random_get, for the session id and the auth client nonce.
getrandom = { version = "0.2" }
wit-bindgen-rt = "0.41"
# JSON for the event payloads and the REST bodies.
serde_json = "1"

[package.metadata.component]
package = "aa:exlap-hook"
